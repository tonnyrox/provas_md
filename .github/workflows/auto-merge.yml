name: Auto Merge Pull Requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required for pull_request_target to get the code from the base branch
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ secrets.AUTOMERGE_TOKEN }}

      - name: Verify author is a collaborator
        id: check_collab
        uses: actions/github-script@v7
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.pull_request.user.login
            });
            console.log('Permission level:', permission.permission);
            if (['admin', 'write', 'maintain'].includes(permission.permission)) {
              core.setOutput('is_collab', 'true');
            } else {
              core.setOutput('is_collab', 'false');
            }
          result-encoding: string

      - name: Auto-approve PR
        if: steps.check_collab.outputs.is_collab == 'true' && github.event.pull_request.review_decision == 'required'
        uses: peter-evans/auto-approve-action@v2
        with:
          github-token: ${{ secrets.AUTOMERGE_TOKEN }}

      - name: Auto-merge PR
        if: steps.check_collab.outputs.is_collab == 'true'
        uses: peter-evans/auto-merge-action@v2
        with:
          merge-method: squash   # can be changed to merge or rebase
          github-token: ${{ secrets.AUTOMERGE_TOKEN }}
